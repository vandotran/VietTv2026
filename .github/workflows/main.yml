name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Giải nén và build
        run: |
          unzip -q VietTV_giaidoan1.zip
          cd VietTV
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VietTV-apk
          path: VietTV/app/build/outputs/apk/debug/app-debug.apk
